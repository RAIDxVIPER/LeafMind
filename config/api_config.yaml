# =============================================================================
# LeafMind — API Configuration (Stage C9a)
# =============================================================================
# Configuration for the FastAPI backend, image gates, timeouts, and CORS.

server:
  host: "127.0.0.1"
  port: 8000
  timeout_seconds: 60.0             # [ENG assumption] Request timeout before returning HTTP 504

limits:
  max_image_size_mb: 10.0          # [ENG assumption] Maximum image payload in MB
  min_dimension_px: 64             # [ENG assumption] Minimum width/height in pixels

cors:
  allowed_origins:                  # Default CORS origins (overridden by ALLOWED_ORIGINS env var)
    - "http://localhost:8501"
    - "http://127.0.0.1:8501"
    - "http://localhost:3000"
    - "http://localhost:5173"

guards:
  healthy_runner_up_threshold: 0.25 # [ENG assumption] I40 healthy-prediction warning threshold

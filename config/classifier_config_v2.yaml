# LeafMind Classifier Configuration -- C2 v2
# =============================================
# v2 targets OOD robustness improvement (I38, I39, I40).
# All v1 behaviours preserved where not explicitly changed.
# Val/test transforms are UNCHANGED -- only training augmentation is modified [DATA spec 2a-iv].
# D1 images NEVER enter this pipeline [D14/R13].
# Model selection stays on val macro-F1 only [ENG].
# New keys all have defaults in train_classifier.py matching v1, so v1 pipeline is unchanged.
# All thresholds are [ENG assumption] unless noted.
# Do NOT change values without updating plan.md threshold register.

model:
  architecture: efficientnet_b3      # timm model name
  pretrained: true                   # ImageNet-1k pretrained weights [ENG]
  num_classes: 30                    # D2 class count [DATA]
  input_size: 224                    # [ENG] 224 = PlantVillage standard
  drop_rate: 0.3                     # [ENG assumption] dropout on classifier head

training:
  seed: 42                           # Fixed seed [R1]
  epochs: 30                         # [ENG assumption] enough for convergence; use early stopping
  batch_size: 16                     # [ENG] reduced for v2 (more memory needed for larger aug pipeline)
  learning_rate: 1.0e-4              # [ENG assumption] AdamW starting LR
  weight_decay: 1.0e-4               # [ENG assumption] AdamW regularisation
  imbalance_strategy: weighted_loss  # "weighted_loss" | "balanced_sampler"
  # RATIONALE [ENG]: Weighted cross-entropy chosen over WeightedRandomSampler.
  # Class weights = N_total / (N_classes * class_count) -- inverse frequency weighting.
  early_stopping_patience: 5        # [ENG] stop if val macro-F1 does not improve for 5 epochs
  scheduler: cosine                  # CosineAnnealingLR [ENG]
  warmup_epochs: 2                   # [ENG] linear warmup for 2 epochs before cosine decay
  # v2: label smoothing in weighted CrossEntropyLoss [ENG] -- 0.0 in v1 (default)
  label_smoothing: 0.1               # [ENG assumption] reduces overconfidence on OOD

augmentation:
  # Applied to training set ONLY -- never to val/test [DATA spec 2a-iv]
  horizontal_flip_p: 0.5            # orientation invariance [ENG]
  vertical_flip_p: 0.3              # less common; valid for top-down shots [ENG]
  rotation_degrees: 30              # rotational invariance [ENG]
  color_jitter:                     # v2: increased vs v1 (0.3) for stronger domain gap [ENG]
    brightness: 0.5
    contrast: 0.5
    saturation: 0.5
    hue: 0.1
  random_resized_crop:              # v2: wider scale range (v1 was 0.7) for zoom variation [ENG]
    scale_min: 0.25
    scale_max: 1.0
    ratio_min: 0.75                 # 3/4
    ratio_max: 1.3333               # 4/3
  grayscale_p: 0.05                 # robustness to desaturated images [ENG]
  gaussian_blur_p: 0.3              # v2: increased vs v1 (0.2) [ENG]
  gaussian_blur_kernel: [3, 7]      # kernel sizes (chosen randomly from odd values in range)
  # v2 additions -- not present in v1 config; default p=0.0 in train_classifier.py
  random_perspective_p: 0.3         # [ENG assumption] perspective distortion for field images
  random_erasing_p: 0.25            # [ENG assumption] applied after ToTensor

calibration:
  # Temperature scaling on D2_Val [ENG spec 2a-viii]
  temperature_init: 1.5            # [ENG] starting value; optimised via NLL minimisation
  max_iter: 50                     # LBFGS iterations [ENG]
  ece_bins: 15                     # bins for ECE computation [ENG]
  ece_target: 0.05                 # [ENG assumption] engineering target; not literature-derived

thresholds:
  # All values are [ENG assumption] -- calibrate on D2_Val after first training run
  ood_flag_confidence: 0.40        # max softmax < 0.40 -> ood_flag=True [ENG assumption]
  escalate_confidence: 0.60        # confidence < 0.60 -> escalate_to_human [ENG assumption]
  escalate_gap: 0.15               # top1-top2 < 0.15 -> escalate_to_human [ENG assumption]
  low_resolution_px: 200           # max(W,H) < 200 -> low_resolution=True [ENG assumption]
  blurry_laplacian: 100.0          # Laplacian var < 100 -> blurry=True [ENG assumption]

paths:
  # All relative to repo root -- no absolute paths [R rule]
  data_root: Dataset_2             # D2 dataset root (relative to repo root)
  manifests_dir: config/manifests
  class_map: config/class_map_d2.json
  exclusion_list: config/exclusion_list.json
  checkpoint_dir: checkpoints/classifier_v2
  model_version: efficientnet_b3_v2

dataloader:
  num_workers: 4                   # [ENG] tune for available CPU cores
  pin_memory: true                 # [ENG] faster GPU transfer

normalization:
  # ImageNet statistics [ENG] -- standard for pretrained EfficientNet
  # UNCHANGED from v1 -- same inference normalisation
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
